<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aspen Ward – Teaching Calendar</title>
<meta name="description" content="Who is teaching each class at Aspen Ward, week by week." />
<meta name="theme-color" content="#4f7942" />
<link rel="icon" href="/public/assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="/public/assets/fonts/plus-jakarta-sans-var.woff2">
<link rel="stylesheet" href="/public/assets/fonts/fonts.css">
<style>
:root {
  color-scheme: light;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: #f8faf5; --surface: #ffffff; --surface-muted: #f5f9f0;
  --stroke: rgba(41, 61, 21, 0.14);
  --ink: #1c2f11; --ink-soft: rgba(28, 47, 17, 0.78); --ink-muted: rgba(28, 47, 17, 0.58);
  --accent: #4f7942; --accent-strong: #3d5e32; --accent-soft: rgba(79, 121, 66, 0.16);
  --swap: #ffddb0; --swap-ink: #7a3a00; --swap-stroke: #f08a1c;
  --filled: #e1f2d8; --covered: #c9ecdc; --error: #b42318;
  --radius: 16px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.45; }
.wrap { width: min(960px, 92vw); margin: 0 auto; }
header.top { background: var(--surface); border-bottom: 1px solid var(--stroke); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand-icon { background: var(--accent); color: #fff; font-weight: 700; border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; }
.brand-title { font-weight: 700; display: block; }
.brand-sub { font-size: .85rem; color: var(--ink-muted); }
main { padding: 24px 0 64px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.lede { color: var(--ink-soft); margin: 0 0 20px; }

button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--stroke); background: var(--surface); color: var(--ink); padding: 10px 16px; min-height: 44px; }
button:hover { background: var(--surface-muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover { background: var(--accent-strong); }
button.warn { background: var(--swap); border-color: var(--swap-stroke); color: var(--swap-ink); }
button.link { border: 0; background: none; color: var(--accent-strong); text-decoration: underline; padding: 6px; min-height: 0; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.tabs { display: inline-flex; border: 1px solid var(--stroke); border-radius: 12px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: var(--surface); }
.tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .88rem; color: var(--ink-soft); margin-bottom: 16px; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--stroke); vertical-align: -2px; margin-right: 6px; }

.month { margin: 28px 0 10px; font-size: 1.05rem; color: var(--accent-strong); }

/* Everyone view: one card per Sunday */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius); padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font-size: 1rem; }
.card.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 5px 8px; border-radius: 8px; font-size: .9rem; }
.line + .line { margin-top: 2px; }
.line .cls { color: var(--ink-muted); flex: 0 0 42%; }
.line .who { text-align: right; flex: 1; }
.line.open .who { color: var(--ink-muted); font-style: italic; }
.line.filled { background: var(--filled); }
.line.covered { background: var(--covered); }
.line.swap { background: var(--swap); color: var(--swap-ink); }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; background: var(--swap-stroke); color: #3d2600; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }

/* My class view: one row per Sunday */
.rows { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-top: 1px solid var(--stroke); }
.row:first-child { border-top: 0; }
.row .date { flex: 0 0 90px; font-weight: 600; }
.row .state { flex: 1 1 160px; }
.row .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.row.filled { background: var(--filled); }
.row.covered { background: var(--covered); }
.row.swap { background: var(--swap); }
.row.suggest .date::after { content: ' ★'; color: var(--accent); }
.hint { color: var(--ink-muted); font-size: .88rem; }

dialog { border: 1px solid var(--stroke); border-radius: var(--radius); padding: 24px; width: min(380px, 92vw); }
dialog::backdrop { background: rgba(20, 30, 15, .45); }
dialog h2 { margin: 0 0 12px; }
label { display: block; font-size: .9rem; font-weight: 600; margin: 12px 0 4px; }
input { font: inherit; width: 100%; padding: 11px 12px; border: 1px solid var(--stroke); border-radius: 10px; min-height: 44px; }
.err { color: var(--error); min-height: 1.3em; margin: 8px 0 0; font-size: .9rem; }
.dlg-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
/* A note on a Sunday (stake conference etc.); "off" means no classes that day */
.note { font-size: .9rem; font-style: italic; color: var(--ink-soft); margin: 0 0 8px; }
.card.off { background: var(--surface-muted); }
.card.fifth { border-top: 3px solid #8fb8d9; }
.tag5 { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #2f5f86; background: #e4f0f9; border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
.tagh { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .02em; color: #8a4b6b; background: #f7e8ef; border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
.row .date .tag5, .row .date .tagh { display: block; margin: 2px 0 0; width: fit-content; }
.card.off .note { font-style: normal; font-weight: 600; margin: 0; }
.row.off { background: var(--surface-muted); color: var(--ink-muted); }
.row .note { margin: 2px 0 0; }
.layout { margin-left: auto; }
.mbar { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
.mbar strong { font-size: 1.15rem; }
.mbar button { min-width: 44px; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mhead { text-align: center; font-size: .78rem; font-weight: 700; color: var(--ink-muted); padding: 4px 0; }
.dcell { background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px; min-height: 64px; padding: 4px 5px; font-size: .8rem; overflow: hidden; }
.dcell.other { background: transparent; border-color: transparent; color: var(--ink-muted); }
.dcell.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.dnum { font-weight: 600; }
.hol { display: block; font-size: .66rem; line-height: 1.2; color: #8a4b6b; margin-top: 1px; }
.dcell.sunday { background: var(--surface); border-color: var(--accent); cursor: pointer; }
.dcell.sunday.off { background: var(--surface-muted); }
.sunbtn { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; min-height: 0; border-radius: 6px; font-size: inherit; }
.sunbtn:hover { background: none; }
.chip { display: block; font-size: .66rem; line-height: 1.25; padding: 1px 4px; margin-top: 2px; border-radius: 4px; border: 1px solid var(--stroke); background: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.filled { background: var(--filled); }
.chip.covered { background: var(--covered); }
.chip.swap { background: var(--swap); border-color: var(--swap-stroke); }
.mnote { display: block; font-size: .66rem; font-style: italic; color: var(--ink-soft); margin-top: 2px; }
.mgrid .tag5 { margin: 2px 0 0; font-size: .6rem; }
@media (max-width: 640px) {
  .dcell { min-height: 54px; padding: 3px; }
  .hol { font-size: .56rem; }
  .chip { font-size: 0; height: 6px; padding: 0; margin-top: 2px; }
  .mgrid .tag5 { display: none; }
}
#day-dlg { width: min(420px, 94vw); }
#day-dlg .card { border: 0; padding: 0; }
.empty { padding: 24px; color: var(--ink-muted); text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-icon">AW</span>
      <span><span class="brand-title">Aspen Ward</span><span class="brand-sub">Teaching Calendar</span></span>
    </a>
    <div id="auth-slot"></div>
  </div>
</header>

<main class="wrap">
  <h1 id="title">Who's teaching</h1>
  <p class="lede" id="lede">Every class, every Sunday.</p>
  <div class="bar" id="bar"></div>
  <div class="legend" id="legend"></div>
  <div id="view"><p class="empty">Loading…</p></div>
</main>

<dialog id="day-dlg">
  <div id="day-body"></div>
  <div class="dlg-acts"><button type="button" id="day-close">Close</button></div>
</dialog>

<dialog id="login">
  <form method="dialog" id="login-form">
    <h2>Teacher sign in</h2>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="first initial + last name">
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <p class="err" id="login-err" role="alert"></p>
    <div class="dlg-acts">
      <button type="button" id="login-cancel">Cancel</button>
      <button type="submit" class="primary">Sign in</button>
    </div>
  </form>
</dialog>

<script type="module">
import { db } from '/js/firebase.js';
import { ref, onValue, update, set, runTransaction } from 'https://www.gstatic.com/firebasejs/11.7.3/firebase-database.js';
import { upcomingSundays, dateKey, fmtSunday, fmtMonth, hashLogin, isPatternSunday, claimLabel, swapKind, firstName, isFifth, holidaysFor, parseKey } from '/js/teaching.js';

const SESSION_KEY = 'teaching-login';
const VISIBLE_STEP = 12;

let data = { classes: {}, people: {}, sundays: {}, notes: {} };
let me = null;            // { username, name, classId, teamId }
let view = 'mine';        // 'mine' | 'all'
let shown = VISIBLE_STEP; // Sundays visible in the Everyone view
let layout = 'list';     // 'list' (default) | 'month' — the Everyone view only
let monthShown = null;   // first day of the month showing in the month view
let loaded = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sundays = upcomingSundays();
const todayKey = dateKey(sundays[0]);

const classList = () => Object.entries(data.classes || {})
  .map(([id, c]) => ({ id, ...c }))
  .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
// A holiday that falls on a Sunday (Easter, Mother's Day...) gets a small tag.
const holCache = {};
const holidayOn = d => (holCache[d.getFullYear()] ||= holidaysFor(d.getFullYear())).get(dateKey(d));
const holTag = d => holidayOn(d) ? `<span class="tagh">${esc(holidayOn(d))}</span>` : '';
const noteFor = key => data.notes?.[key] || null;
const claim = (key, classId) => data.sundays?.[key]?.[classId] || null;
const claimPath = (key, classId) => ref(db, `teaching/sundays/${key}/${classId}`);

// ---------- sign in ----------
async function resolveSession() {
  me = null;
  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    const person = saved && data.people?.[saved.u];
    if (person && person.hash === saved.h) {
      me = { username: saved.u, name: person.name, classId: person.classId, teamId: person.teamId, role: person.role };
    }
  } catch { /* storage blocked or corrupt: stay signed out */ }
}

$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const u = $('u').value.trim().toLowerCase();
  const person = data.people?.[u];
  const h = person ? await hashLogin(u, $('p').value) : null;
  if (!person || person.hash !== h) {
    $('login-err').textContent = 'That username or password is not right.';
    return;
  }
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ u, h })); } catch { /* still signed in this visit */ }
  $('login').close();
  await resolveSession();
  view = me?.classId ? 'mine' : 'all';
  render();
});
$('day-close').addEventListener('click', () => $('day-dlg').close());
$('login-cancel').addEventListener('click', () => $('login').close());

function signOut() {
  try { localStorage.removeItem(SESSION_KEY); } catch {}
  me = null;
  view = 'all';
  render();
}

// ---------- actions ----------
// Claims go through a transaction so two people tapping the same Sunday at once
// cannot both win; the loser's tap is simply a no-op and the page updates.
async function takeSunday(key) {
  await runTransaction(claimPath(key, me.classId), cur =>
    cur === null ? { teamId: me.teamId, by: me.username } : undefined);
}
async function giveUp(key) { await set(claimPath(key, me.classId), null); }
// kind: 'full' (the whole team needs cover), 'partial' (just me), or null to cancel.
async function setSwap(key, kind) {
  await update(claimPath(key, me.classId), kind === 'partial'
    ? { swap: 'partial', swapFor: me.name }
    : { swap: kind || null, swapFor: null });
}
// Covering a full swap takes the whole Sunday; covering a partial one fills in for
// the one teacher and the pair keeps teaching.
async function coverSunday(key) {
  await runTransaction(claimPath(key, me.classId), cur => {
    const kind = swapKind(cur);
    if (!kind) return undefined;
    if (kind === 'partial') {
      const { swap, swapFor, ...rest } = cur;
      return { ...rest, coverName: me.name, coverFor: swapFor || '', covered: true };
    }
    return { teamId: me.teamId, by: me.username, covered: true };
  });
}
async function fillPattern() {
  const team = data.classes[me.classId].teams[me.teamId];
  const writes = {};
  for (const d of sundays) {
    const key = dateKey(d);
    if (isPatternSunday(team, d) && !claim(key, me.classId) && !noteFor(key)?.noClass) {
      writes[`${key}/${me.classId}`] = { teamId: me.teamId, by: me.username };
    }
  }
  if (Object.keys(writes).length) await update(ref(db, 'teaching/sundays'), writes);
}

// ---------- rendering ----------
function renderChrome() {
  $('auth-slot').innerHTML = me
    ? `<span class="hint">${esc(me.name)}</span> ${me.role === 'presidency' ? '<a href="/teaching-admin">Manage</a>' : ''} <button class="link" id="signout">Sign out</button>`
    : `<button id="signin">Teacher sign in</button>`;
  $('signout')?.addEventListener('click', signOut);
  $('signin')?.addEventListener('click', () => { $('login-err').textContent = ''; $('login').showModal(); $('u').focus(); });

  $('bar').innerHTML =
    (me && me.classId
      ? `<div class="tabs"><button data-v="mine" aria-pressed="${view === 'mine'}">My class</button><button data-v="all" aria-pressed="${view === 'all'}">Everyone</button></div>`
      : '') +
    (view === 'all'
      ? `<div class="tabs layout"><button data-l="list" aria-pressed="${layout === 'list'}">List</button><button data-l="month" aria-pressed="${layout === 'month'}">Month</button></div>`
      : '');
  $('bar').querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; render(); }));
  $('bar').querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => { layout = b.dataset.l; render(); }));

  const key = (c, label) => `<span><i style="background:${c}"></i>${label}</span>`;
  $('legend').innerHTML = key('var(--filled)', 'Filled') + key('var(--covered)', 'Covered after a swap, or by a sub') +
    key('var(--swap)', 'Needs a sub or swap') + key('#fff', 'Open') +
    (view === 'mine' && me?.classId ? '<span>★ In your usual pattern</span>' : '');
}

// Open = white. Filled = green. Filled by a cover or a sub = a slightly different
// green. A swap request stays orange until someone fills it.
function lineState(cl) {
  if (!cl) return ' open';
  if (swapKind(cl)) return ' swap';
  return cl.covered || cl.sub ? ' covered' : ' filled';
}

function swapBadge(cl) {
  const kind = swapKind(cl);
  if (!kind) return '';
  const text = kind === 'partial' ? `Needs 1 sub${cl.swapFor ? ` (${firstName(cl.swapFor)})` : ''}` : 'Needs full cover';
  return `<span class="badge">${esc(text)}</span>`;
}

// One Sunday as a card: used by the list view and the month view's pop-up.
function sundayCard(d, classes) {
  const key = dateKey(d), note = noteFor(key);
  const today = key === todayKey ? ' today' : '';
  if (note?.noClass) {
    return `<div class="card off${today}"><h3>${fmtSunday(d)}${holTag(d)}</h3><p class="note">${esc(note.text || 'No classes')}</p></div>`;
  }
  let html = `<div class="card${today}${isFifth(d) ? ' fifth' : ''}"><h3>${fmtSunday(d)}${isFifth(d) ? '<span class="tag5">5th Sunday</span>' : ''}${holTag(d)}</h3>`;
  if (note?.text) html += `<p class="note">${esc(note.text)}</p>`;
  for (const c of classes) {
    const cl = claim(key, c.id);
    const who = cl ? esc(claimLabel(data.classes, c.id, cl)) : 'Open';
    html += `<div class="line${lineState(cl)}"><span class="cls">${esc(c.name)}</span><span class="who">${who}${swapBadge(cl)}</span></div>`;
  }
  return html + '</div>';
}

function renderAll() {
  $('title').textContent = "Who's teaching";
  $('lede').textContent = 'Every class, every Sunday.';
  const classes = classList();
  if (!classes.length) return '<p class="empty">The calendar has not been set up yet.</p>';
  if (layout === 'month') return renderMonth(classes);

  let html = '', month = '';
  for (const d of sundays.slice(0, shown)) {
    const m = fmtMonth(d);
    if (m !== month) { if (month) html += '</div>'; html += `<h2 class="month">${m}</h2><div class="cards">`; month = m; }
    html += sundayCard(d, classes);
  }
  html += '</div>';
  if (shown < sundays.length) html += `<p style="text-align:center;margin-top:20px"><button id="more">Show more Sundays</button></p>`;
  return html;
}

// Full-month grid. Sundays show a colour chip per class (tap one for the detail);
// holidays are labelled on their day.
function renderMonth(classes) {
  const first = parseKey(todayKey), last = sundays[sundays.length - 1];
  const minMonth = new Date(first.getFullYear(), first.getMonth(), 1);
  const maxMonth = new Date(last.getFullYear(), last.getMonth(), 1);
  if (!monthShown || monthShown < minMonth) monthShown = minMonth;
  if (monthShown > maxMonth) monthShown = maxMonth;

  const y = monthShown.getFullYear(), m = monthShown.getMonth();
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const end = new Date(y, m + 1, 0); end.setDate(end.getDate() + (6 - end.getDay()));
  const hol = new Map([...holidaysFor(y - 1), ...holidaysFor(y), ...holidaysFor(y + 1)]);
  const sundaySet = new Set(sundays.map(dateKey));

  let html = `<div class="mbar"><button data-mn="-1" aria-label="Previous month"${monthShown <= minMonth ? ' disabled' : ''}>‹</button><strong>${fmtMonth(monthShown)}</strong><button data-mn="1" aria-label="Next month"${monthShown >= maxMonth ? ' disabled' : ''}>›</button></div><div class="mgrid">`;
  for (const w of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']) html += `<div class="mhead">${w}</div>`;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const key = dateKey(d), name = hol.get(key), note = noteFor(key);
    const isSun = sundaySet.has(key);
    let inner = `<span class="dnum">${d.getDate()}</span>${name ? `<span class="hol">${esc(name)}</span>` : ''}`;
    if (isSun) {
      inner += `<button class="sunbtn" data-sun="${key}" aria-label="Who is teaching on ${fmtSunday(d)}">`;
      if (note?.noClass) inner += `<span class="mnote">${esc(note.text || 'No classes')}</span>`;
      else {
        inner += classes.map(c => `<span class="chip${lineState(claim(key, c.id))}">${esc(c.name)}</span>`).join('');
        if (isFifth(d)) inner += '<span class="tag5">5th</span>';
        if (note?.text) inner += `<span class="mnote">${esc(note.text)}</span>`;
      }
      inner += '</button>';
    }
    html += `<div class="dcell${d.getMonth() === m ? '' : ' other'}${key === todayKey ? ' today' : ''}${isSun ? ' sunday' : ''}${isSun && note?.noClass ? ' off' : ''}">${inner}</div>`;
  }
  return html + '</div>';
}

function renderMine() {
  const cls = data.classes?.[me.classId];
  if (!cls) return '<p class="empty">Your class could not be found. Please tell the ward clerk.</p>';
  const team = cls.teams[me.teamId];
  $('title').textContent = cls.name;
  $('lede').textContent = `Signed in as ${me.name}. You teach with ${team.label}.`;

  const canFill = team.pattern && (team.pattern.every || team.pattern.nth);
  let html = '';
  if (canFill) html += `<p><button class="primary" id="fill">Sign up my usual Sundays</button> <span class="hint">Takes every open ★ Sunday below for your team.</span></p>`;
  else html += `<p class="hint">Tap a Sunday to take it. If you need a sub, tap “I need a sub” (just you) or “We both need a sub”, and the others in your class will see it.</p>`;

  html += '<div class="rows">';
  for (const d of sundays) {
    const key = dateKey(d);
    const cl = claim(key, me.classId);
    const suggest = isPatternSunday(team, d);
    const note = noteFor(key);
    let cls_ = 'row', state = '', acts = '';
    if (note?.noClass) {
      html += `<div class="row off"><span class="date">${fmtSunday(d)}</span><span class="state"><strong>${esc(note.text || 'No classes')}</strong></span></div>`;
      continue;
    }
    if (!cl) {
      state = '<span class="hint">Open</span>';
      acts = `<button class="primary" data-a="take" data-k="${key}">Take this Sunday</button>`;
    } else if (cl.teamId === me.teamId) {
      cls_ += lineState(cl);
      const kind = swapKind(cl);
      const pair = (team.members || []).length > 1;
      state = kind
        ? `<strong>${kind === 'partial' ? `Sub requested for ${esc(firstName(cl.swapFor) || 'one of you')}` : 'Full swap requested'}</strong> <span class="hint">waiting for someone to cover</span>`
        : `<strong>You’re teaching</strong>${cl.coverName ? ` <span class="hint">${esc(firstName(cl.coverName))} covering for ${esc(firstName(cl.coverFor))}</span>` : ''}`;
      acts = kind
        ? `<button data-a="unswap" data-k="${key}">Cancel request</button>`
        : (pair
            ? `<button class="warn" data-a="swap-partial" data-k="${key}">I need a sub</button><button class="warn" data-a="swap-full" data-k="${key}">We both need a sub</button>`
            : `<button class="warn" data-a="swap-full" data-k="${key}">Need a swap</button>`) +
          `<button class="link" data-a="give" data-k="${key}">Give up</button>`;
    } else {
      cls_ += lineState(cl);
      const kind = swapKind(cl);
      state = `${esc(claimLabel(data.classes, me.classId, cl))}${swapBadge(cl)}`;
      if (kind) acts = `<button class="primary" data-a="cover" data-k="${key}">${kind === 'partial' ? `I’ll cover ${esc(firstName(cl.swapFor) || 'them')}` : 'I’ll cover it'}</button>`;
    }
    if (suggest) cls_ += ' suggest';
    if (note?.text) state += `<p class="note">${esc(note.text)}</p>`;
    html += `<div class="${cls_}"><span class="date">${fmtSunday(d)}${isFifth(d) ? '<span class="tag5">5th Sunday</span>' : ''}${holTag(d)}</span><span class="state">${state}</span><span class="acts">${acts}</span></div>`;
  }
  return html + '</div>';
}

function render() {
  if (!loaded) return;
  if (!me || !me.classId) view = 'all';
  renderChrome();
  $('view').innerHTML = view === 'mine' && me?.classId ? renderMine() : renderAll();

  $('more')?.addEventListener('click', () => { shown += VISIBLE_STEP; render(); });
  $('view').querySelectorAll('[data-mn]').forEach(b => b.addEventListener('click', () => {
    monthShown = new Date(monthShown.getFullYear(), monthShown.getMonth() + Number(b.dataset.mn), 1);
    render();
  }));
  $('view').querySelectorAll('[data-sun]').forEach(b => b.addEventListener('click', () => {
    $('day-body').innerHTML = sundayCard(parseKey(b.dataset.sun), classList());
    $('day-dlg').showModal();
  }));
  $('fill')?.addEventListener('click', () => fillPattern().catch(fail));
  $('view').querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    const act = { take: () => takeSunday(k), give: () => giveUp(k), 'swap-full': () => setSwap(k, 'full'),
                  'swap-partial': () => setSwap(k, 'partial'), unswap: () => setSwap(k, null),
                  cover: () => coverSunday(k) }[b.dataset.a];
    b.disabled = true;
    act().catch(fail);
  }));
}

function fail(err) {
  console.error(err);
  alert('That did not save. Check your connection and try again.');
  render();
}

// ---------- live data ----------
onValue(ref(db, 'teaching'), async snap => {
  const v = snap.val() || {};
  data = { classes: v.classes || {}, people: v.people || {}, sundays: v.sundays || {}, notes: v.notes || {} };
  for (const c of Object.values(data.classes)) c.teams = c.teams || {};
  await resolveSession();
  loaded = true;
  render();
}, err => {
  console.error(err);
  $('view').innerHTML = '<p class="empty">The calendar could not be loaded. Please try again later.</p>';
});
</script>
</body>
