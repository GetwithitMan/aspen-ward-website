<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aspen Ward - Printable Program</title>
<link rel="icon" href="/public/assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">

<style>
  /* === INK ===
     The greys here had drifted into a mix of neutral (#222, #444, #555, #666)
     and warm. Warm greys read as softer and friendlier than neutral ones, and
     using a single family consistently is itself easier to process - which is
     the whole mechanism behind a page feeling pleasant rather than merely
     legible. Lightness is matched to what each value replaced, so nothing loses
     contrast; the two lightest actually gain a little. */
  :root {
    --ink-strong: #17170f;  /* 18.0:1  names and titles - what people look for */
    --ink:        #26251d;  /* 15.4:1  body */
    --ink-mid:    #47463d;  /*  9.5:1  quieter body copy */
    --ink-soft:   #55564e;  /*  7.4:1  secondary lines */
    --ink-muted:  #63625a;  /*  6.1:1  row labels, contact details */
    --ink-faint:  #93938a;  /*  3.1:1  screen-only empty and loading states */
    --accent:     #2c5530;  /*  8.6:1  the ward green */
  }

  /* === BASE PRINT SETTINGS === */
  @page {
    size: 11in 8.5in; /* Landscape */
    margin: 0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Crimson Pro", "Georgia", serif;
    background: #e8e8e8;
    color: var(--ink);
  }

  /* === SCREEN-ONLY CONTROLS === */
  .print-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    gap: 10px;
  }

  .print-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .print-btn:hover {
    background: #1e3d22;
  }

  .reload-btn {
    background: #555;
  }

  .reload-btn:hover {
    background: #333;
  }

  @media print {
    .print-controls { display: none; }
  }

  /* Shown only while previewing, when content had to be cut */
  .fit-warning {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: 20px;
    z-index: 1000;
    background: #8a2b2b;
    color: #fff;
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.45;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  @media print {
    .fit-warning { display: none; }
  }

  /* Landmark wrapper only - display:contents keeps it out of the layout so
     the sheets still behave exactly as direct children of body. */
  main { display: contents; }

  /* === THE PHYSICAL SHEET === */
  .sheet {
    background: white;
    width: 11in;
    height: 8.5in;
    display: flex;
    overflow: hidden;
    page-break-after: always;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    margin: 30px auto;
  }

  @media print {
    body { background: none; }
    .sheet {
      box-shadow: none;
      margin: 0;
    }
  }

  /* === LEFT & RIGHT HALVES === */
  .half-page {
    width: 50%;
    height: 100%;
    padding: 0.5in;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .left-side {
    border-right: 1px dashed #ccc;
  }

  @media print {
    .left-side { border-right: none; }
  }

  /* === PAGE 1: EVENTS (Left) + FRONT COVER (Right) === */

  /* Events section on back cover */
  .events-page {
    padding: 0.5in;
    display: flex;
    flex-direction: column;
  }

  /* Events sit above missionaries & military on the back page. allocateBackPage()
     divides the column between them by what each side actually needs; the values
     here are only the starting point it measures from. */
  .events-container {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .events-content {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .missionaries-section {
    flex: 0 1 auto;
    min-height: 0;
    overflow: hidden;
    margin-top: 0;
    padding-top: 0.2in;
    border-top: 1px solid #ddd;
    display: flex;
    flex-direction: column;
  }

  .missionaries-content {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .events-header {
    font-family: "Playfair Display", serif;
    text-wrap: balance;
    font-size: 20pt;
    font-weight: 600;
    text-align: center;
    color: var(--accent);
    margin-bottom: 0.1in;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--accent);
  }

  #events-list {
  }

  .event-item {
    margin-bottom: calc(0.1in * var(--fit, 1));
    padding-bottom: calc(0.07in * var(--fit, 1));
    border-bottom: 1px solid #eee;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .event-item:last-child {
    border-bottom: none;
  }

  .event-date {
    font-size: calc(11pt * var(--fit, 1));
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .event-title {
    font-size: calc(14pt * var(--fit, 1));
    font-weight: 600;
    color: var(--ink);
    margin: 2px 0;
    text-wrap: balance;
    break-after: avoid;
    page-break-after: avoid;
  }

  .event-info {
    font-size: calc(12pt * var(--fit, 1));
    color: var(--ink-soft);
    line-height: 1.4;
    white-space: pre-wrap;
    /* Events go two-up at five or more, and the column is narrow enough there
       for hyphenation to earn its keep. */
    hyphens: auto;
    text-wrap: pretty;
  }

  /* Front cover with logo */
  .front-cover {
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(180deg, #f9f9f9 0%, #fff 100%);
    padding: 0.4in;
  }

  .cover-logo {
    width: 3.5in;
    height: auto;
    max-height: 2.5in;
    object-fit: contain;
    margin-bottom: 0.25in;
  }

  /* Line-art emblems are portrait; size them by height for consistent presence. */
  .cover-logo.cover-emblem {
    width: auto;
    height: 2.5in;
    max-height: 2.5in;
  }

  /* Fine-art pictures: framed, sized to fit whatever their aspect ratio is. */
  .cover-logo.cover-art {
    width: auto;
    max-width: 3.4in;
    height: auto;
    max-height: 3.3in;
    border: 1px solid #999;
    padding: 5px;
    background: #fff;
  }

  .cover-logo-placeholder {
    width: 2.5in;
    height: 1.5in;
    border: 2px dashed #ccc;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--ink-faint);
    font-size: 10pt;
    margin: 0 auto 0.3in auto;
  }

  /* "The Church of Jesus Christ of Latter-day Saints" is the longest line on
     the cover and the first thing anyone reads. Set in full capitals it was a
     46-character block of rectangles: caps cost readers 10-20% of their reading
     speed, because word shapes disappear and each letter has to be read on its
     own. Small caps keep the formal, quiet look while giving the words their
     shapes back - and title case is how the Church sets its own name. */
  .cover-badge {
    font-size: 12pt;
    font-variant: small-caps;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 0.15in;
  }

  .cover-title {
    font-family: "Playfair Display", serif;
    font-size: 42pt;
    font-weight: 600;
    margin: 0 0 0.1in 0;
    color: var(--ink-strong);
  }

  .cover-subtitle {
    font-size: 16pt;
    color: var(--ink-soft);
    margin: 0 0 0.15in 0;
  }

  .cover-date {
    font-size: 14pt;
    color: var(--accent);
    font-weight: 500;
  }

  .cover-welcome {
    font-size: 12pt;
    color: var(--ink-mid);
    margin: 0.2in 0 0 0;
    line-height: 1.5;
    font-style: italic;
    max-width: 4in;
  }

  .cover-welcome:empty {
    display: none;
  }

  .cover-divider {
    width: 1.5in;
    height: 2px;
    background: var(--accent);
    margin: 0.25in auto;
  }

  /* === PAGE 2: ANNOUNCEMENTS (Left) + PROGRAM (Right) === */

  /* Announcements section */
  .announcements-page {
    padding: 0.5in;
  }

  .announcements-header {
    font-family: "Playfair Display", serif;
    text-wrap: balance;
    font-size: 20pt;
    font-weight: 600;
    text-align: center;
    color: var(--accent);
    margin-bottom: 0.1in;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--accent);
  }

  /* The inside-left panel holds Announcements and, below them, the Temple
     section. The wrapper is the height-bounded box that the fit pass scales, so
     both blocks shrink together as one unit to fill the panel. */
  #inside-left-content {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  #announcements-list {
    overflow: visible;
  }

  /* Temple section — styled like Announcements and living in the same fitted
     region, so every size is calc(... * var(--fit)). */
  .temple-print {
    margin-top: calc(0.16in * var(--fit, 1));
    padding-top: calc(0.1in * var(--fit, 1));
    border-top: 2px solid var(--accent);
  }

  .temple-print-header {
    font-family: "Playfair Display", serif;
    text-wrap: balance;
    font-size: calc(16pt * var(--fit, 1));
    font-weight: 600;
    text-align: center;
    color: var(--accent);
    margin-bottom: calc(0.05in * var(--fit, 1));
  }

  .temple-print-name {
    text-align: center;
    font-size: calc(11pt * var(--fit, 1));
    color: var(--ink-soft);
    margin-bottom: calc(0.06in * var(--fit, 1));
  }

  .temple-print-row {
    display: flex;
    justify-content: space-between;
    gap: 0.3in;
    font-size: calc(11.5pt * var(--fit, 1));
    color: var(--ink-mid);
    padding: calc(0.035in * var(--fit, 1)) 0;
  }

  .temple-print-row .day {
    font-weight: 600;
    color: var(--ink-soft);
    flex: 0 0 auto;
  }

  .temple-print-row .times {
    text-align: right;
  }

  .temple-print-sub {
    font-size: calc(11pt * var(--fit, 1));
    font-weight: 600;
    color: var(--accent);
    margin-top: calc(0.07in * var(--fit, 1));
    margin-bottom: calc(0.02in * var(--fit, 1));
  }

  /* An inline recommend-interview heading: the label sits left, its detail is
     pushed to the right edge with the space in the middle, matching the
     day/time rows above it. */
  .temple-print-sub-inline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.3in;
    font-weight: 400;
    color: var(--ink-mid);
  }

  .temple-print-sub-inline .sub-label {
    font-weight: 600;
    color: var(--accent);
    flex: 0 0 auto;
  }

  .temple-print-sub-inline .sub-detail {
    text-align: right;
  }

  .temple-print-closed {
    font-size: calc(11pt * var(--fit, 1));
    color: #7a1f1f;
    font-weight: 600;
    margin: calc(0.03in * var(--fit, 1)) 0;
  }

  .temple-print-note {
    font-size: calc(10.5pt * var(--fit, 1));
    color: var(--ink-mid);
    margin-top: calc(0.05in * var(--fit, 1));
  }

  .announcement-item {
    margin-bottom: calc(0.13in * var(--fit, 1));
    padding-bottom: calc(0.07in * var(--fit, 1));
    border-bottom: 1px solid #eee;
  }

  .announcement-item:last-child {
    border-bottom: none;
  }

  .announcement-title {
    font-size: calc(14.5pt * var(--fit, 1));
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 2px;
    /* A two-line heading splits evenly rather than leaving one word below. */
    text-wrap: balance;
    /* Never let the heading sit alone at the foot of a column. */
    break-after: avoid;
    page-break-after: avoid;
  }

  .announcement-description {
    font-size: calc(12pt * var(--fit, 1));
    color: var(--ink-mid);
    line-height: 1.35;
    white-space: pre-wrap;
    /* The long announcements are the only real running prose on the sheet, and
       they were losing a third of their width to ragged line ends. Hyphenating
       packs the same text into 26 lines instead of 32, which the fit pass hands
       straight back as larger type. Needs <html lang> to know the language. */
    hyphens: auto;
    /* Only acts when a paragraph would otherwise end on a stranded word. */
    text-wrap: pretty;
    /* Keeps a lone line of a paragraph off the bottom or top of a column when
       a heavy week falls back to two columns. */
    orphans: 2;
    widows: 2;
  }

  /* An announcement with a QR sits text-left, code-right. The code has a floor
     size (max) so it stays scannable even when the fit pass shrinks the type. */
  .announcement-item.has-qr {
    display: flex;
    gap: calc(0.16in * var(--fit, 1));
    align-items: flex-start;
  }

  .announcement-item.has-qr .announcement-main {
    flex: 1 1 auto;
    min-width: 0;
  }

  .announcement-qr {
    flex: 0 0 auto;
    text-align: center;
    break-inside: avoid;
  }

  .announcement-qr .qr-svg {
    /* Physical size comes from the width/height attributes on the SVG itself
       (module count × a safe per-module size), so the code stays as small as
       its data allows and never shrinks below scannable with the fit pass. */
    display: block;
    margin: 0 auto;
  }

  .announcement-qr .qr-caption {
    font-size: calc(8pt * var(--fit, 1));
    color: var(--ink-mid);
    line-height: 1.2;
    margin-top: 2px;
    max-width: 1in;
  }

  /* Program section (full right side) */
  .program-page {
    padding: 0.4in 0.5in;
  }

  .program-header {
    font-family: "Playfair Display", serif;
    text-wrap: balance;
    font-size: 22pt;
    font-weight: 600;
    text-align: center;
    color: var(--accent);
    margin-bottom: 0.1in;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--accent);
  }

  /* The program is the one region that never had a fit pass, so a long week
     silently lost its last rows. It now scales like every other region. */
  #program-content {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* === SECTION STYLING === */
  .section-block {
    margin-bottom: calc(0.08in * var(--fit, 1));
  }

  .section-header {
    font-family: "Playfair Display", serif;
    font-size: calc(15pt * var(--fit, 1));
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
    margin-bottom: 3px;
  }

  /* === PROGRAM ROWS === */
  .program-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: calc(3px * var(--fit, 1));
    line-height: 1.25;
  }

  /* The label is the question and the name is the answer, so they should not
     compete. A smaller, softer label lets the eye run straight down the names,
     which is what anyone is actually looking for. Size and weight do the work
     here, not colour - the program is printed in greyscale. */
  .row-label {
    font-size: calc(13.5pt * var(--fit, 1));
    color: var(--ink-muted);
    flex-shrink: 0;
    margin-right: 8px;
    min-width: 1.4in;
  }

  /* pre-wrap so line breaks typed in the admin panel print as typed, and so a
     long name wraps instead of being shrunk to fit one line. */
  .row-name {
    font-size: calc(16pt * var(--fit, 1));
    color: var(--ink-strong);
    text-align: right;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    flex: 1;
    max-width: 2.8in;
  }

  /* A row with no label - "Administration of the Sacrament" - is a moment in
     the meeting, not a label/value pair. Right-aligned it read as an answer to
     a missing question; centred and italic it reads as what it is. */
  .program-row.is-standalone {
    justify-content: center;
  }

  .program-row.is-standalone .row-name {
    text-align: center;
    font-style: italic;
    color: var(--ink-soft);
    max-width: none;
  }

  /* === HYMN ROWS ===
     A hymn prints as "#62 - All Creatures Of Our God And King", which is wider
     than the name column and used to wrap under itself. The number stays at the
     row's full size; only the title shrinks, and only as far as it has to, so
     the whole hymn sits on one line. */
  .row-name.is-hymn {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    white-space: nowrap;
    /* A single line can use the slack the wrapped two-line version never
       needed, which is often enough to avoid shrinking at all. */
    max-width: 3in;
  }

  .hymn-number {
    flex: 0 0 auto;
    margin-right: 0.06in;
  }

  /* min-width:0 lets the title shrink below its text width, so its own box
     width is exactly the space left for it. overflow:hidden means a bad
     measurement clips instead of bleeding into the label. */
  .hymn-title {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    font-size: calc(16pt * var(--fit, 1) * var(--name-fit, 1));
  }

  /* No readable size gets this title onto one line. Drop back to plain inline
     flow so the number and title wrap together as one right-aligned block -
     byte for byte how every hymn printed before. */
  .row-name.is-hymn.wraps {
    display: block;
    white-space: normal;
  }

  .row-name.is-hymn.wraps .hymn-title {
    overflow: visible;
    overflow-wrap: break-word;
  }

  /* === LOADING STATE === */
  .loading {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    color: var(--ink-faint);
    font-size: 12pt;
  }

  /* === TESTIMONY MEETING SPECIAL === */
  .testimony-message {
    font-style: italic;
    text-align: center;
    color: var(--ink-mid);
    font-size: calc(11pt * var(--fit, 1));
    line-height: 1.4;
    border-top: 1px solid #d8d9d0;
    border-bottom: 1px solid #d8d9d0;
    padding: 0.16in 0.2in;
    margin: 0.14in 0;
    white-space: pre-wrap;
  }

  /* === EMPTY STATE === */
  .empty-state {
    text-align: center;
    color: var(--ink-faint);
    font-style: italic;
    padding: 1in 0;
  }

  /* === MISSIONARIES & MILITARY SECTION === */
  .missionaries-header {
    font-family: "Playfair Display", serif;
    text-wrap: balance;
    font-size: 16pt;
    font-weight: 600;
    text-align: center;
    color: var(--accent);
    margin-bottom: 0.08in;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--accent);
  }

  .missionary-item {
    margin-bottom: calc(0.07in * var(--fit, 1));
    padding-bottom: calc(0.05in * var(--fit, 1));
    border-bottom: 1px solid #eee;
    break-inside: avoid;
  }

  .missionary-item:last-child {
    border-bottom: none;
  }

  .missionary-type {
    font-size: calc(9pt * var(--fit, 1));
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .missionary-name {
    font-size: calc(13pt * var(--fit, 1));
    font-weight: 600;
    color: var(--ink);
    margin: 1px 0;
  }

  .missionary-location {
    font-size: calc(11pt * var(--fit, 1));
    color: var(--ink-soft);
    font-style: italic;
  }

  .missionary-contact {
    font-size: calc(10pt * var(--fit, 1));
    color: var(--ink-muted);
    margin-top: 2px;
    line-height: 1.3;
    overflow-wrap: break-word;
  }

  .missionary-contact a {
    color: var(--accent);
    text-decoration: none;
  }
</style>

<body>

<!-- Screen-only print button -->
<div class="print-controls">
  <button class="print-btn reload-btn" onclick="location.reload()">Refresh Data</button>
  <button class="print-btn" onclick="window.print()">Print Program</button>
</div>

<main>
<!-- PAGE 1: EVENTS (Left) + FRONT COVER (Right) -->
<div class="sheet" id="page-1">
  <!-- Events (when folded, this is the back) -->
  <div class="half-page left-side events-page" id="events-section">
    <!-- Events container: 2/3 of the page -->
    <div class="events-container">
      <div class="events-header">Upcoming Events</div>
      <div class="events-content" id="events-content">
        <div class="loading" id="events-loading">Loading events...</div>
        <div id="events-list"></div>
      </div>
    </div>

    <!-- Missionaries & Military Section: 1/3 of the page -->
    <div id="missionaries-section" class="missionaries-section" style="display: none;">
      <div class="missionaries-header">Missionaries &amp; Military</div>
      <div class="missionaries-content" id="missionaries-content">
        <div id="missionaries-list"></div>
      </div>
    </div>
  </div>

  <!-- Front Cover with Logo (when folded, this is the front) -->
  <div class="half-page right-side front-cover">
    <div>
      <img src="/public/assets/ward-logo.jpeg" alt="Aspen Ward" class="cover-logo" id="cover-logo">
      <div class="cover-badge">The Church of Jesus Christ of Latter-day Saints</div>
      <h1 class="cover-title">Aspen Ward</h1>
      <p class="cover-subtitle">Sacrament Meeting</p>
      <div class="cover-divider"></div>
      <p class="cover-date" id="program-date">Loading...</p>
      <p class="cover-welcome" id="cover-welcome"></p>
    </div>
  </div>
</div>

<!-- PAGE 2: ANNOUNCEMENTS (Left) + PROGRAM (Right) -->
<div class="sheet" id="page-2">
  <!-- Announcements -->
  <div class="half-page left-side announcements-page" id="announcements-section">
    <div class="announcements-header">Ward Announcements</div>

<!-- QR generator (vendored locally, MIT). Classic script runs before the

<script type="module">
// Read-only page: plain database reads, no SDK bundle.
import { readPath } from "/js/db-read.js";

// Everything below builds HTML strings from admin-entered text, so anything
// interpolated has to be escaped or a stray angle bracket breaks the program.
function escapeHtml(text = '') {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Get current Sunday's date
function getCurrentSunday() {
  const today = new Date();
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay());
  return sunday.toLocaleDateString('en-US', {
    weekday: 'long',
    month: 'long',
    day: 'numeric',
    year: 'numeric'
  });
}

// Hymns are entered as "#62 - All Creatures Of Our God And King". Splitting the
// number off the title lets the printed row keep the number at full size and
// shrink only the title, instead of wrapping the whole thing onto two lines.
//
// Group 1 is the number and its separator; group 2 is the title.
const HYMN_PATTERN = /^(#?\s*\d{1,4}\s*(?:[-–—:]\s*)?)(\S.*)$/;

function splitHymn(label = '', details = '') {
  // Multi-line details are deliberate formatting, not a hymn - leave them be.
  if (details.includes('\n')) return null;

  const match = details.match(HYMN_PATTERN);
  if (!match) return null;

  // A bare leading number could be anything ("2 Nephi 2:25"), so require either
  // a "#" or a label that says this row is music.
  const looksMusical = /hymn|song|musical/i.test(label);
  if (!details.trimStart().startsWith('#') && !looksMusical) return null;

  // The title has to contain letters - "#5 - 10" is not a hymn title.
  if (!/[A-Za-z]/.test(match[2])) return null;

  return { number: match[1].trim(), title: match[2].trim() };
}

// Render a section block for the program
function createSectionHTML(title, items) {
  if (!items || items.length === 0) return '';

  // Filter out items without details
  const validItems = items.filter(item => item.details && item.details.trim());
  if (validItems.length === 0) return '';

  let html = `<div class="section-block">
    <div class="section-header">${escapeHtml(title)}</div>`;

  validItems.forEach(item => {
    const label = item.label || '';
    const details = item.details || '';
    const hymn = splitHymn(label, details);

    const name = hymn
      ? `<span class="hymn-number">${escapeHtml(hymn.number)}</span>` +
        `<span class="hymn-title">${escapeHtml(hymn.title)}</span>`
      : escapeHtml(details);

    // No label means this is a moment in the meeting rather than a
    // label/value pair, and it is centred instead of right-aligned.
    const standalone = !label.trim();

    html += `
      <div class="program-row${standalone ? ' is-standalone' : ''}">
        <span class="row-label">${escapeHtml(label)}</span>
        <span class="row-name${hymn ? ' is-hymn' : ''}">${name}</span>
      </div>`;
  });

  html += '</div>';
  return html;
}

async function loadProgram() {
  try {
    const data = await readPath('sundayProgram');

    // Set the date
    document.getElementById('program-date').textContent = getCurrentSunday();

    // Set the welcome/introduction message on front cover
    if (data && data.introduction) {
      document.getElementById('cover-welcome').textContent = data.introduction;
    }

    // Set the cover image (a seasonal emblem, or the default Church logo).
    setCoverImage(data && data.coverImage);

    if (!data || !data.sections) {
      document.getElementById('program-loading').style.display = 'none';
      document.getElementById('program-content').innerHTML = '<p class="empty-state">No program data available.</p>';
      return;
    }

    // Build the full program
    let programHTML = '';

    // Opening section
    programHTML += createSectionHTML('Opening', data.sections.opening);

    // Sacrament section
    programHTML += createSectionHTML('Sacrament', data.sections.sacrament);

    // If testimony meeting, add special header and message instead of speakers
    if (data.isTestimonyMeeting || data.meetingType === 'Testimony Meeting' || data.meetingType === 'testimony') {
      // Update main header title
      const progHeader = document.querySelector('.program-header');
      if (progHeader) progHeader.textContent = "Fast & Testimony Meeting";

      programHTML += `<div class="section-block">
        <div class="section-header">Testimonies</div>
        <div class="testimony-message">${escapeHtml(data.testimonyMessage || 'Members of the congregation are invited to share their testimonies.')}</div>
      </div>`;
    } else {
      const progHeader = document.querySelector('.program-header');
      if (progHeader) progHeader.textContent = "Sacrament Meeting Program";
      // Speakers/Program section
      programHTML += createSectionHTML('Program', data.sections.speakers);
    }

    // Closing section
    programHTML += createSectionHTML('Closing', data.sections.closing);

    document.getElementById('program-loading').style.display = 'none';
    document.getElementById('program-content').innerHTML = programHTML || '<p class="empty-state">No program data available.</p>';

    // Load announcements from the program data
    loadAnnouncements(data.sections.announcements);

  } catch (error) {
    console.error('Failed to load program:', error);
    document.getElementById('program-loading').style.display = 'none';
    document.getElementById('program-content').innerHTML = '<p class="empty-state">Unable to load program.</p>';
    document.getElementById('program-date').textContent = getCurrentSunday();

}

// Load announcements
function loadAnnouncements(announcements) {
  const container = document.getElementById('announcements-list');
  const loading = document.getElementById('announcements-loading');

  loading.style.display = 'none';

  if (!announcements || announcements.length === 0) {
    container.innerHTML = '<p class="empty-state">No announcements this week.</p>';
    return;
  }

  // Filter out empty announcements
  const validAnnouncements = announcements.filter(a =>
    (a.label && a.label.trim()) || (a.details && a.details.trim())
  );

  if (validAnnouncements.length === 0) {
    container.innerHTML = '<p class="empty-state">No announcements this week.</p>';
    return;
  }

  let html = '';
  validAnnouncements.forEach(item => {
    // A QR prints when the announcement points somewhere: an explicit link
    // (scan to open), or online-only overflow text (scan for the rest, which
    // lives on the website's announcements section).
    const link = (item.link || '').trim();
    const more = (item.moreOnline || '').trim();
    const caption = (item.linkLabel || '').trim() || 'Scan for more info';
    let qr = '';
    if (link) {
      qr = qrBlock(link, caption);
    } else if (more) {
      // Short path (redirects to the announcements section) so the read-more
      // code has fewer modules and can print smaller while staying scannable.
      qr = qrBlock('https://aspenward.com/a', caption);
    }

    const body = `
        <div class="announcement-main">
          <div class="announcement-title">${escapeHtml(item.label || 'Announcement')}</div>
          <div class="announcement-description">${escapeHtml(item.details || '')}</div>
        </div>`;
    html += `
      <div class="announcement-item${qr ? ' has-qr' : ''}">
        ${body}
        ${qr}
      </div>`;
  });

  container.innerHTML = html;
}

// A captioned QR code for the printed program. The SVG is built from the code
// matrix so it scales crisply and is styled by CSS.
function qrBlock(url, caption) {
  const svg = makeQrSvg(url);
  if (!svg) return '';
  return `<div class="announcement-qr">${svg}<div class="qr-caption">${escapeHtml(caption)}</div></div>`;
}

// Each QR square (module) is printed at a fixed physical size, so a code is
// exactly as small as its data allows: a short link prints tiny, a long one
// grows to stay scannable. 0.5mm/module is the safe floor for scanning a
// black-on-white laser print at arm's length.
const QR_MODULE_MM = 0.5;

function makeQrSvg(text) {
  try {
    if (typeof qrcode !== 'function') return '';
    const q = qrcode(0, 'M');
    q.addData(String(text));
    q.make();
    const n = q.getModuleCount();
    const margin = 2; // quiet zone, in modules
    const dim = n + margin * 2;
    let rects = '';
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (q.isDark(r, c)) rects += `<rect x="${c + margin}" y="${r + margin}" width="1" height="1"/>`;
      }
    }
    const sizeMm = (dim * QR_MODULE_MM).toFixed(2);
    return `<svg class="qr-svg" width="${sizeMm}mm" height="${sizeMm}mm" viewBox="0 0 ${dim} ${dim}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${dim}" height="${dim}" fill="#ffffff"/><g fill="#000000">${rects}</g></svg>`;
  } catch (error) {
    console.error('QR generation failed:', error);
    return '';
  }
}

// Load events from Firebase
async function loadEvents() {
  const container = document.getElementById('events-list');
  const loading = document.getElementById('events-loading');

  try {
    const data = await readPath('events');

    loading.style.display = 'none';

    // Firebase hands back an object rather than an array whenever the keys are
    // sparse - delete the second of three events and the rest arrive as
    // {0:…, 2:…}. Insisting on an array printed "No upcoming events" for a page
    // full of them. The home page and loadMissionaries() both allow for it.
    const events = Array.isArray(data)
      ? data
      : (data && typeof data === 'object' ? Object.values(data) : []);

    if (events.length === 0) {
      container.innerHTML = '<p class="empty-state">No upcoming events.</p>';
      return;
    }

    // Filter out empty events
    const validEvents = events.filter(e => e && (e.title || e.info));

    if (validEvents.length === 0) {
      container.innerHTML = '<p class="empty-state">No upcoming events.</p>';
      return;
    }

    // Conditional columns: 1 column for < 5 events, 2 columns for 5+
    if (validEvents.length >= 5) {
      container.style.columnCount = '2';
      container.style.columnGap = '0.25in';
    } else {
      container.style.columnCount = '1';
    }

    let html = '';
    validEvents.forEach(event => {
      html += `
        <div class="event-item">
          <div class="event-date">${escapeHtml(event.date || 'Date TBD')}</div>
          <div class="event-title">${escapeHtml(event.title || 'Ward Event')}</div>
          <div class="event-info">${escapeHtml(event.info || '')}</div>
        </div>`;
    });

    container.innerHTML = html;

  } catch (error) {
    console.error('Failed to load events:', error);
    loading.style.display = 'none';
    container.innerHTML = '<p class="empty-state">Unable to load events.</p>';
  }
}

// Shared temple formatters. Firebase can hand back a sparse list as an object,
// so every list is normalised through templeList() first.
const TEMPLE_ORDINALS = { '1st': '1st', '2nd': '2nd', '3rd': '3rd', '4th': '4th', 'last': 'Last', '2-5': '2nd–5th' };
const templeList = (v) => Array.isArray(v) ? v.filter(Boolean)
  : (v && typeof v === 'object' ? Object.values(v).filter(Boolean) : []);

function templeTime12(hhmm) {
  if (typeof hhmm !== 'string' || !/^\d{1,2}:\d{2}$/.test(hhmm)) return '';
  let [h, m] = hhmm.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${String(m).padStart(2, '0')} ${ap}`;
}

function templeRanges(ranges) {
  return templeList(ranges).map((r) => {
    const o = templeTime12(r.open), c = templeTime12(r.close);
    return o && c ? `${o} – ${c}` : (o || c || '');
  }).filter(Boolean).join(' and ');
}

function templeDayLabel(entry) {
  const day = entry.day || '';
  if (entry.cadence && entry.cadence !== 'weekly') {
    return `${TEMPLE_ORDINALS[entry.cadence] || entry.cadence} ${day}`.trim();
  }
  return day;
}

function templeClosureText(c) {
  if (!c || !c.start) return '';
  const parse = (s) => {
    const parts = String(s).split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return null;
    return new Date(parts[0], parts[1] - 1, parts[2]);
  };
  const start = parse(c.start);
  if (!start) return '';
  const end = (c.end && c.end !== c.start) ? parse(c.end) : null;
  const md = (d) => d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  let text;
  if (!end) {
    // A single day reads best with its weekday.
    text = start.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  } else if (start.getFullYear() === end.getFullYear() && start.getMonth() === end.getMonth()) {
    text = `${md(start)} – ${end.getDate()}, ${end.getFullYear()}`;
  } else if (start.getFullYear() === end.getFullYear()) {
    text = `${md(start)} – ${md(end)}, ${end.getFullYear()}`;
  } else {
    text = `${md(start)}, ${start.getFullYear()} – ${md(end)}, ${end.getFullYear()}`;
  }
  return c.reason ? `${text} (${c.reason})` : text;
}

// Temple section on the inside-left panel, below Announcements. Shares that
// panel's fitted region, so it is built from the same classes that scale.
async function loadTemple() {
  const wrap = document.getElementById('temple-print');
  if (!wrap) return;

  try {
    const t = await readPath('temple');
    const has = (v) => typeof v === 'string' && v.trim().length > 0;
    const hours = templeList(t && t.hours);
    const closures = templeList(t && t.closures);
    const iv = (t && t.interviews) || {};
    const ivHas = (b) => b && (templeList(b.rows).length || has(b.location) || has(b.note) || has(b.contact));
    const meaningful = t && (has(t.templeName) || hours.length || closures.length ||
      ivHas(iv.stake) || ivHas(iv.ward) || has(t.notes));

    if (!t || !t.show || !meaningful) {
      wrap.style.display = 'none';
      return;
    }

    const nl2br = (s) => escapeHtml(s).replace(/\n/g, '<br>');
    const scheduleRows = (entries) => entries.map((e) => {
      const times = templeRanges(e.ranges);
      if (!times) return '';
      return `<div class="temple-print-row"><span class="day">${escapeHtml(templeDayLabel(e))}</span><span class="times">${escapeHtml(times)}</span></div>`;
    }).join('');

    let html = '<div class="temple-print-header">Temple</div>';
    if (has(t.templeName)) html += `<div class="temple-print-name">${escapeHtml(t.templeName)}</div>`;
    html += scheduleRows(hours);

    closures.forEach((c) => {
      const txt = templeClosureText(c);
      if (txt) html += `<div class="temple-print-closed">Closed: ${escapeHtml(txt)}</div>`;
    });

    const interviewBlock = (heading, block) => {
      if (!ivHas(block)) return '';
      const rows = templeList(block.rows);
      const location = has(block.location) ? nl2br(block.location) : '';
      const below = [];
      if (has(block.note)) below.push(nl2br(block.note));
      if (has(block.contact)) below.push(nl2br(block.contact));
      const inlineHead = (detail) =>
        `<div class="temple-print-sub temple-print-sub-inline"><span class="sub-label">${escapeHtml(heading)}</span><span class="sub-detail">${detail}</span></div>`;

      // No set schedule (e.g. the ward's "by appointment"): heading and its
      // detail share one line.
      if (!rows.length) {
        return inlineHead([location, ...below].filter(Boolean).join(' · '));
      }
      // Scheduled block: the place (location) rides on the heading line, the
      // times sit below it, and any note/contact follow.
      let out = location ? inlineHead(location) : `<div class="temple-print-sub">${escapeHtml(heading)}</div>`;
      out += scheduleRows(rows);
      if (below.length) out += `<div class="temple-print-note">${below.join('<br>')}</div>`;
      return out;
    };
    html += interviewBlock('Stake Recommend Interviews', iv.stake);
    html += interviewBlock('Ward Recommend Interviews', iv.ward);

    if (has(t.notes)) html += `<div class="temple-print-note">${nl2br(t.notes)}</div>`;

    wrap.innerHTML = html;
    wrap.style.display = 'block';
  } catch (error) {
    console.error('Failed to load temple info:', error);
    wrap.style.display = 'none';
  }
}

// === FIT CONTENT TO ITS HALF-PAGE ===
//
// Every region is a fixed-height box with overflow hidden, so anything too tall
// used to be silently cut off — a speaker could just vanish from the program.
// Each region now scales as a unit via a --fit multiplier that all its font
// sizes and spacing are expressed against, binary-searched to the largest value
// that still fits. Replaces three near-identical shrink loops (and the program,
// which had no fit pass at all).

const FIT_REGIONS = [
  { name: 'program',       box: '#program-content' },
  { name: 'events',        box: '.events-content' },
  { name: 'announcements', box: '#inside-left-content' },
  { name: 'missionaries',  box: '.missionaries-content' }
];

const MIN_FIT = 0.55; // below this the print is too small to read
const MAX_FIT = 1.2;  // grow a light week's text up to this to fill the page —
                      // gentle, so a sparse panel does not blow up oversized

// Height alone is not enough: the events list uses column-count, and content
// that will not fit spills into an extra column sideways rather than growing
// taller.
function overflows(box) {
  // No slack: a sub-pixel overrun still shows up as a clipped final line.
  return box.scrollHeight > box.clientHeight || box.scrollWidth > box.clientWidth;
}

// Below this a hymn title is too small to sit next to a full-size number, so it
// is allowed to wrap instead.
const MIN_HYMN_FIT = 0.72;

// Titles are laid out nowrap, so the browser puts the text on one line at its
// natural width whatever the column can hold. The ratio of the two is the exact
// scale that makes it fit - no search needed, unlike the region pass.
const measureRange = document.createRange();

function fitHymnTitles(box) {
  const titles = box.querySelectorAll('.hymn-title');
  if (!titles.length) return;

  // Write every reset first, then read every measurement, so the browser lays
  // out once per pass instead of once per row.
  titles.forEach(title => {
    title.style.setProperty('--name-fit', '1');
    title.parentElement.classList.remove('wraps');
  });

  const scales = Array.from(titles, title => {
    const available = title.getBoundingClientRect().width;
    measureRange.selectNodeContents(title);
    const natural = measureRange.getBoundingClientRect().width;
    if (!natural || natural <= available) return 1;
    // 0.995 keeps the last glyph clear of the clip edge.
    return (available / natural) * 0.995;
  });

  titles.forEach((title, i) => {
    if (scales[i] >= 1) return;

    // Past the floor there is no size that gets this title onto one line, and
    // shrinking a title that is going to wrap anyway just makes it small AND
    // wrapped. Leave it full size and let it wrap, exactly as it always has.
    if (scales[i] < MIN_HYMN_FIT) {
      title.parentElement.classList.add('wraps');
      return;
    }

    title.style.setProperty('--name-fit', String(scales[i]));
  });
}

function fitRegion(box) {
  if (!box || !box.children.length) return 1;

  // Hymn titles are measured against a column whose width is fixed in inches
  // while the text scales with --fit, so they have to be re-fitted at every
  // candidate scale before the region's height means anything.
  const applyFit = (scale) => {
    box.style.setProperty('--fit', String(scale));
    fitHymnTitles(box);
  };

  applyFit(1);

  // When the content already fits, grow it to fill the box (up to MAX_FIT) so a
  // light week is not small text stranded on a half-empty page. When it does
  // not fit, shrink it (down to MIN_FIT) as before.
  let low, high;
  if (!overflows(box)) {
    low = 1;
    high = MAX_FIT;
  } else {
    low = MIN_FIT;
    high = 1;
  }
  let best = low;

  // Binary-search the largest scale that still fits.
  for (let i = 0; i < 12; i++) {
    const mid = (low + high) / 2;
    applyFit(mid);
    if (!overflows(box)) {
      best = mid;
      low = mid;
    } else {
      high = mid;
    }
  }

  applyFit(best);
  return best;
}

// === SHARE THE BACK PAGE BETWEEN EVENTS AND MISSIONARIES ===
//
// Missionaries used to be capped at 45% of the column. A long missionary list
// was therefore shrunk to fit that 45% even when the events above it ended
// halfway down the page and the space was going spare. Each side now gets the
// share of the column its content actually needs.

// Neither side is squeezed below this, so one very long list cannot push the
// other off the page entirely.
const MIN_COLUMN_SHARE = 0.25;

function allocateBackPage() {
  const events = document.querySelector('.events-container');
  const missionaries = document.getElementById('missionaries-section');
  if (!events) return;

  const page = events.parentElement;

  // No missionaries this week: events get the whole column.
  if (!missionaries || missionaries.style.display === 'none') {
    events.style.flex = '1 1 auto';
    events.style.height = '';
    return;
  }

  // Measure at full size and at natural height, or we would be dividing the
  // column according to how small the last pass happened to squeeze things.
  ['.events-content', '.missionaries-content'].forEach(sel => {
    const box = page.querySelector(sel);
    if (box) box.style.setProperty('--fit', '1');
  });

  const sections = [events, missionaries];
  sections.forEach(section => {
    section.style.flex = '0 0 auto';
    section.style.height = 'auto';
  });

  const pad = getComputedStyle(page);
  const available = page.clientHeight
    - parseFloat(pad.paddingTop) - parseFloat(pad.paddingBottom);

  const natural = sections.map(s => s.getBoundingClientRect().height);
  const total = natural[0] + natural[1];

  // It all fits at full size. Let events absorb the slack so the missionaries
  // block still sits against the bottom of the page, as it always has.
  if (total <= available) {
    events.style.flex = '1 1 auto';
    events.style.height = '';
    return;
  }

  // Otherwise divide in proportion to need, so both sides end up shrunk by
  // roughly the same amount instead of one carrying all of it.
  const floor = available * MIN_COLUMN_SHARE;
  let eventsHeight = Math.min(Math.max(available * (natural[0] / total), floor),
                              available - floor);

  // The floor can hand a side more room than it has content to fill - one short
  // event against a long missionary list. That surplus is worth more to the
  // side that is actually short, so pass it over rather than print a gap.
  if (eventsHeight > natural[0]) eventsHeight = natural[0];
  else if (available - eventsHeight > natural[1]) eventsHeight = available - natural[1];

  events.style.height = `${eventsHeight}px`;
  missionaries.style.height = `${available - eventsHeight}px`;
}

// === ANNOUNCEMENTS: TWO COLUMNS BEFORE TINY TYPE ===
//
// A heavy announcements week had only one answer - shrink the type until it
// fit. A second column holds roughly twice the text at a given size, which is
// the same trick the events list already uses. Try both and keep whichever
// prints larger.

// Above this the single column is comfortable and a second one would only make
// the lines needlessly narrow.
const ANNOUNCEMENT_COLUMN_THRESHOLD = 0.85;

// The inside-left panel holds Announcements and, when present, the Temple
// section below them. Both scale together off one --fit set on the wrapper, so
// the whole panel is measured as a unit. The one-versus-two column trial is
// applied to the announcements list only; the temple rows always stack.
function fitInsideLeft(wrap) {
  const list = wrap.querySelector('#announcements-list');
  if (!list) return fitRegion(wrap);

  list.style.columnCount = '1';
  const single = fitRegion(wrap);
  if (single > ANNOUNCEMENT_COLUMN_THRESHOLD) return single;

  list.style.columnCount = '2';
  list.style.columnGap = '0.25in';
  const double = fitRegion(wrap);
  if (double > single) return double;

  // Two columns did not help - a single very long announcement, most likely.
  list.style.columnCount = '1';
  return fitRegion(wrap);
}

function fitAllRegions() {
  const tooSmall = [];

  // Divide the back page before measuring anything on it: the events and
  // missionaries boxes have no fixed height until this has run.
  allocateBackPage();

  FIT_REGIONS.forEach(({ name, box: selector }) => {
    const box = document.querySelector(selector);
    if (!box) return;
    const scale = selector === '#inside-left-content'
      ? fitInsideLeft(box)
      : fitRegion(box);
    // Report anything that still does not fit even at the floor, so a genuinely
    // overloaded week is visible rather than quietly truncated.
    if (scale <= MIN_FIT + 0.001 && overflows(box)) {
      tooSmall.push(`${name} (overflows by ${Math.round(box.scrollHeight - box.clientHeight)}px at minimum size)`);
    }
  });

  reportOverflow(tooSmall);
}

// If content cannot fit even at the smallest readable size, say so on screen
// rather than printing a program that quietly drops people. Screen only —
// .print-controls is hidden when printing.
function reportOverflow(tooSmall) {
  let banner = document.getElementById('fit-warning');

  if (!tooSmall.length) {
    banner?.remove();
    return;
  }

  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'fit-warning';
    banner.className = 'fit-warning';
    document.body.appendChild(banner);
  }

  banner.textContent =
    'Too much content to fit on two pages: ' + tooSmall.join('; ') +
    '. Some items are cut off — remove or shorten a few entries in the admin panel.';
  console.warn('Printable program: ' + banner.textContent);
}

// Re-fit whenever the measurements could have changed. Web fonts in particular
// land after first paint and shift every height; the old code guessed with a
// fixed 500ms timeout.
function scheduleFit() {
  requestAnimationFrame(() => requestAnimationFrame(fitAllRegions));
}

// Initialize
async function init() {
  await Promise.all([
    loadProgram(),
    loadEvents(),
    loadMissionaries(),
    loadTemple()
  ]);

  scheduleFit();

  // Web fonts change every measurement, so fit again once they are in.
  if (document.fonts?.ready) {
    document.fonts.ready.then(scheduleFit);
  }

  // The browser may lay out differently for print than for screen.
  window.addEventListener('beforeprint', fitAllRegions);

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitAllRegions, 150);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
